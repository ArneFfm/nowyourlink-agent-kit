name: Publish MCP Registry
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
      - run: mcp-publisher login github-oidc
      - name: Publish every server document
        # A document whose version is already in the registry answers 400
        # "cannot publish duplicate version". That is the wanted state, not a
        # failure, and it must not stop the documents after it. Any other
        # failure still fails the job.
        run: |
          status=0
          for manifest in server.json server-docs.json server-advertiser.json; do
            echo "::group::$manifest"
            if output=$(mcp-publisher publish "$manifest" 2>&1); then
              echo "$output"
            elif printf '%s' "$output" | grep -q 'cannot publish duplicate version'; then
              echo "$output"
              echo "$manifest: this version is already published; nothing to do."
            else
              echo "$output"
              echo "::error::$manifest failed to publish."
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
