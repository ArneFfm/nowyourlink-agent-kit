name: Go SDK

on:
  push:
    paths: ['go.mod', 'nowyourlink/**', '.github/workflows/go.yml']
  pull_request:
    paths: ['go.mod', 'nowyourlink/**', '.github/workflows/go.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
